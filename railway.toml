project = "mellow-renewal"

[build]
  builder = "NIXPACKS"

[deploy]
  startCommand = "php artisan config:clear && php artisan config:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"

[services]
  [services.app]
  dockerfile = "Dockerfile"
  startCommand = "php artisan config:clear && php artisan config:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
