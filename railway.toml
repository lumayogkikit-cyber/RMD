project = "mellow-renewal"

[build]
  command = "composer install --no-dev --optimize-autoloader && npm install && npm run build"

[deploy]
  command = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"

[services]
  [services.app]
  dockerfile = "Dockerfile"
  startCommand = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
